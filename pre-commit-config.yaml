repos:
-   repo: https://github.com/qoomon/git-conventional-commits
    rev: v2.9.0
    hooks:
    -   id: conventional-commits
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
    -   id: black
